- title: "Early Dengue Detection in Bangladesh Using Symptom Analysis and Time-Series Forecasting"
  type: Research project
  link: https://github.com/Khalidsyfullah/Research-on-Bangladeshi-Dengue-Data
  description: "Detects dengue early in Bangladesh using district-wise case data (2016–2024) and a symptom-based survey. A two-step model combines time-series forecasting (Prophet) with symptom-based classification (Random Forest, XGBoost), reaching up to 92.5% accuracy as a non-invasive diagnostic aid."
  tech: "Python, LSTM, Prophet, scikit-learn, XGBoost, Random Forest, Google Forms"

- title: "Privacy-Preserving Early Detection of Autism Spectrum Disorder Using Federated Learning"
  type: Research project
  link: https://github.com/Khalidsyfullah/Federated-Learning-for-Autism-Spectrum-Disorder
  description: "Federated learning on the Autism Gait and Gesture dataset with a client–server architecture, so patient data never leaves the client. Achieved 97.5% accuracy."
  tech: "Python, TensorFlow, deep learning, RSA encryption"

