<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Open menu">
      <label for="nav-toggle" class="nav-button" aria-hidden="true"><span></span></label>
      <nav class="site-nav">
        {% for item in site.navigation %}
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% if page.url != "/" %}<h1 class="page-title">{{ page.title }}</h1>{% endif %}
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      © {{ site.time | date: "%Y" }} {{ site.title }} · Last updated {{ site.time | date: "%B %Y" }}
    </div>
  </footer>
</body>
</html>
